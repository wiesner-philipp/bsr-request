services:
  bsr-requests:
    image: ghcr.io/wiesner-philipp/bsr-requests:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
    volumes:
      - bsr-data:/data
volumes:
  bsr-data:
