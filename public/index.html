<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="page_title">Beat Saber Wunschliste</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="bar">
      <div class="sabers" aria-hidden="true"><i></i><i></i></div>
      <div class="lang" role="group" data-i18n-label="lang_label">
        <button type="button" data-lang="de" title="Deutsch">DE</button>
        <button type="button" data-lang="en" title="English">EN</button>
      </div>
    </div>
    <h1 data-i18n="heading">Beat Saber Wunschliste</h1>
    <p id="status" class="status"></p>
    <div class="controls">
      <input id="q" type="search" data-i18n-ph="search_ph" data-i18n-label="search_label" autocomplete="off">
      <select id="sort" data-i18n-label="sort_label">
        <option value="Latest" data-i18n="sort_Latest"></option>
        <option value="Rating" data-i18n="sort_Rating"></option>
        <option value="Curated" data-i18n="sort_Curated"></option>
        <option value="Relevance" data-i18n="sort_Relevance"></option>
      </select>
    </div>
  </header>

  <main>
    <ul id="grid" class="grid"></ul>
    <p id="empty" class="note" data-i18n="empty" hidden></p>
    <p id="error" class="note err" hidden></p>
    <button id="more" class="more" data-i18n="load_more" hidden></button>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
